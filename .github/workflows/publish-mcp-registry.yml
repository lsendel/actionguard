name: Publish to Official MCP Registry

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish-registry:
    name: Publish to registry.modelcontextprotocol.io
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for GitHub OIDC authentication
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install mcp-publisher CLI
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json Manifest
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to Official MCP Registry
        run: ./mcp-publisher publish
