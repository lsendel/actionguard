name: 'ActionGuard Protocol CI Gate'
description: 'Continuously verify MCP servers and A2A endpoints, prevent breaking schema drift, and detect prompt poisoning.'
author: 'ActionGuard Architecture Team'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target_url:
    description: 'The target MCP server or A2A endpoint URL to probe'
    required: true
  pinned_hash:
    description: 'The expected schema_sha256 digest to enforce'
    required: false
  fail_on_drift:
    description: 'Exit with non-zero exit code if schema or descriptions drifted'
    required: false
    default: 'true'
  github_token:
    description: 'GitHub token for posting pull request review comments (e.g. ${{ github.token }})'
    required: false
    default: ''
  comment_pr:
    description: 'Automatically post rich markdown integrity comments on Pull Requests'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Run ActionGuard Protocol Gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token || env.GITHUB_TOKEN }}
      run: |
        EXTRA_ARGS=""
        if [ "${{ inputs.comment_pr }}" = "true" ]; then
          EXTRA_ARGS="$EXTRA_ARGS --comment-pr"
        fi
        if [ -n "${{ inputs.github_token }}" ]; then
          EXTRA_ARGS="$EXTRA_ARGS --github-token ${{ inputs.github_token }}"
        fi

        if [ -n "${{ inputs.pinned_hash }}" ]; then
          node "${{ github.action_path }}/bin/action.cjs" check "${{ inputs.target_url }}" --pin "${{ inputs.pinned_hash }}" $EXTRA_ARGS
        else
          node "${{ github.action_path }}/bin/action.cjs" inspect "${{ inputs.target_url }}" $EXTRA_ARGS
        fi
